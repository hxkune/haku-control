name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# The open build (without haku Pro): checked on every push and pull request. Releases are made by the paid build
# in the private pro repository, which publishes its installer here (see its .github/workflows/release.yml).
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      # releases are code-signed through SignPath (free for open source, see SIGNING.md) once the project is set up
      # there; without the token everything is built unsigned, as before
      SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' && github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v5

      - name: Build
        shell: pwsh
        env:
          HAKU_REPO: ${{ github.repository }}   # the app checks this repo for new releases
        run: |
          cmd /c build.cmd 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE) {
            # the last lines as annotations, so the reason shows on the run's summary page
            # (GitHub shows at most 10 per step: errors first)
            $log = Get-Content build.log
            $bad = $log | Select-String -Pattern 'error|fatal|not found|not recognized|cannot|unresolved' | ForEach-Object { $_.Line }
            if (-not $bad) { $bad = $log | Select-Object -Last 10 }
            $bad | Select-Object -First 10 | ForEach-Object { "::error title=build::$_" }
            exit 1
          }
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          "VERSION=$v" >> $env:GITHUB_ENV

      # the checks that need no hardware: simulators, a fake OpenRGB server, the phone page in node,
      # and the UI against the mock core in headless Chrome
      - name: Tests (no hardware)
        shell: cmd
        run: tools\sim\run-tests.cmd

      - name: UI tests (mock, headless Chrome)
        shell: pwsh
        run: tools\sim\ui-tests.ps1

      # the installer unpacks to exactly what pack.ps1 packed, at res\version.h's version (and the tag's, on a tag)
      - name: Installer check
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          tools\sim\setup-check.ps1 -Version $tag
          if ($LASTEXITCODE) { exit 1 }

      # the tests write their logs under %TEMP% (not runner.temp): gathered here for the artifact
      - name: Gather the logs of a failed run
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory failed-logs -Force | Out-Null
          Copy-Item build.log failed-logs -ErrorAction SilentlyContinue
          Copy-Item "$env:TEMP\haku-tests\*.log" failed-logs -ErrorAction SilentlyContinue
          Get-ChildItem $env:TEMP -Directory -Filter 'haku-setup-check-*' | ForEach-Object { Copy-Item $_.FullName failed-logs -Recurse }

      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-run-logs
          if-no-files-found: ignore
          path: failed-logs

      # ---- signing, step 1: the program's own executables (they go into the installer afterwards)
      - name: Upload the executables for signing
        if: env.SIGN == 'true'
        id: unsigned-program
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-program
          path: |
            bin/haku-control.exe
            bin/haku-control-open.exe
            bin/haku-control-hotspot.exe

      - name: Sign the executables
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: program
          github-artifact-id: ${{ steps.unsigned-program.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600   # every release is approved by hand
          output-artifact-directory: signed-program
          parameters: |
            version: "${{ env.VERSION }}"

      - name: Build the installer from the signed executables
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          Copy-Item signed-program\*.exe bin -Force
          cmd /c build.cmd setup
          if ($LASTEXITCODE) { exit 1 }

      # ---- signing, step 2: the installer
      - name: Upload the installer for signing
        if: env.SIGN == 'true'
        id: unsigned-setup
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-setup
          path: dist/haku-control-setup.exe

      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-setup
          parameters: |
            version: "${{ env.VERSION }}"

      - name: Take the signed installer
        if: env.SIGN == 'true'
        shell: pwsh
        run: Copy-Item signed-setup\haku-control-setup.exe dist -Force

      # the installer's SHA-256 beside it: haku checks updates against it when the GitHub API is out of reach
      - name: Checksum and package
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'dev-' + $env:GITHUB_SHA.Substring(0, 7) }
          scripts\package.ps1 -Version $v

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG }}
          path: |
            ${{ env.PKG }}.zip
            dist/haku-control-setup.exe
