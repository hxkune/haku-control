name: Discord news cards

on:
  release:
    types: [published]
  pull_request:
    paths:
      - '.github/workflows/discord-news.yml'
      - 'tools/discord_news.py'
      - 'tools/test_discord_news.py'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the latest stable release card to Discord
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: discord-news-${{ github.event.release.id || github.ref }}
  cancel-in-progress: false

jobs:
  card:
    if: github.event_name != 'release' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || '' }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - run: python -m unittest discover -s tools -p 'test_discord_news.py'
      - name: Read release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: gh api "repos/$GH_REPO/releases/${RELEASE_ID:-latest}" > release.json
      - name: Render preview
        run: python tools/discord_news.py release.json
      - uses: actions/upload-artifact@v7
        with:
          name: haku-control-news-card
          path: haku-control-news.png
      - name: Publish card
        if: github.event_name == 'release' || inputs.publish
        env:
          DISCORD_NEWS_WEBHOOK_URL: ${{ secrets.DISCORD_NEWS_WEBHOOK_URL }}
        run: python tools/discord_news.py release.json --publish
