<svg xmlns="http://www.w3.org/2000/svg" viewBox="45 20 200 175" width="200" height="175" fill="none">
  <defs>
    <!-- matte dark body -->
    <linearGradient id="mono-body-off-rot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#222225" />
      <stop offset="63%" stop-color="#121214" />
      <stop offset="100%" stop-color="#1c1c1f" />
    </linearGradient>

    <!-- screen off (black glass) -->
    <linearGradient id="mono-glass-off-rot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1d" />
      <stop offset="55%" stop-color="#0c0c0e" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>
  </defs>

  <g id="tryx-screen-mono-off-rotated">
    <!-- top of the body (3D face) -->
    <path d="M 68,50 L 82,44 L 154,56 Q 164,58 172,54 L 204,41 L 216,46 L 178,62 Q 164,68 148,65 Z" fill="#1e1e22" stroke="#303036" stroke-width="1.2" stroke-linejoin="round" />

    <!-- curved L body -->
    <path d="M 68,50 L 148,65 Q 164,68 178,62 L 216,46 A 4,4 0 0 1 220,50 L 220,144 A 5,5 0 0 1 216,148 L 178,166 Q 164,173 148,169 L 68,152 A 5,5 0 0 1 64,148 L 64,54 A 4,4 0 0 1 68,50 Z" fill="url(#mono-body-off-rot)" stroke="#333338" stroke-width="1.5" />

    <!-- the screen off -->
    <path d="M 72,58 L 148,72 Q 164,75 178,69 L 212,54 L 212,141 L 178,158 Q 164,164 148,161 L 72,145 Z" fill="url(#mono-glass-off-rot)" stroke="#1c1c1f" stroke-width="1" />

    <!-- faint depth on the glass bend -->
    <path d="M 149,72 Q 164,75 177,69 L 177,158 Q 164,164 149,161 Z" fill="#ffffff" opacity="0.025" />
    
    <!-- wide diagonal highlight on the front glass -->
    <path d="M 73,59 L 138,71 L 104,151 L 73,144 Z" fill="#ffffff" opacity="0.03" />
  </g>
</svg>