<svg xmlns="http://www.w3.org/2000/svg" viewBox="45 20 200 175" width="200" height="175" fill="none">
  <defs>
    <!-- matte dark body -->
    <linearGradient id="off-body-solo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#202022" />
      <stop offset="50%" stop-color="#121214" />
      <stop offset="100%" stop-color="#202022" />
    </linearGradient>

    <!-- screen off (black glass) -->
    <linearGradient id="off-glass-solo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1d" />
      <stop offset="45%" stop-color="#0c0c0e" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>
  </defs>

  <g id="tryx-screen-only-off">
    <!-- top cover of the body -->
    <path d="M 75,48 L 87,43 L 136,57 Q 145,60 154,57 L 206,43 L 218,48 L 162,64 Q 145,69 128,64 Z" fill="#222225" stroke="#333338" stroke-width="1.2" stroke-linejoin="round" />

    <!-- L-display body -->
    <path d="M 75,48 L 128,64 Q 145,69 162,64 L 218,48 A 4,4 0 0 1 222,52 L 222,146 A 5,5 0 0 1 218,150 L 162,168 Q 145,174 128,168 L 75,150 A 5,5 0 0 1 71,146 L 71,52 A 4,4 0 0 1 75,48 Z" fill="url(#off-body-solo)" stroke="#333338" stroke-width="1.5" />

    <!-- AMOLED screen, off -->
    <path d="M 79,56 L 128,71 Q 145,76 162,71 L 214,56 L 214,143 L 162,160 Q 145,165 128,160 L 79,143 Z" fill="url(#off-glass-solo)" stroke="#1c1c1f" stroke-width="1" />

    <!-- faint volume on the fold -->
    <path d="M 132,72 Q 145,76 158,72 L 158,160 Q 145,164 132,160 Z" fill="#ffffff" opacity="0.02" />

    <!-- diagonal glass glare -->
    <path d="M 80,57 L 126,71 L 96,148 L 80,142 Z" fill="#ffffff" opacity="0.03" />
  </g>
</svg>
