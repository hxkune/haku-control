<!doctype html>

<!-- The tray panel (ui_tray.cpp): its own small page, not the window's index.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>haku control</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="tray.css">
</head>
<body>
<main id="panel" class="panel" aria-label="haku control">
  <section id="v-main" class="view">
    <div id="head"></div>
    <div class="card">
      <div class="bri-h"><label id="bri-l" for="bri">Brightness</label><b id="bri-v" aria-hidden="true"></b></div>
      <input id="bri" type="range" min="0" max="100" step="1" value="0" data-key="bri">
      <div id="err-power"></div>
    </div>
    <div class="card" id="sec-prof"><div id="prof"></div></div>
    <div class="card" id="fx"></div>
    <div class="card" id="devs"></div>
    <div id="foot"></div>
  </section>
  <section id="v-profiles" class="view" hidden></section>
  <section id="v-effects" class="view" hidden></section>
  <section id="v-devices" class="view" hidden></section>
  <section id="v-more" class="view" hidden></section>
</main>
<div id="live" class="sr" role="status" aria-live="polite"></div>
<script>/* in a normal browser: ?mock = design preview with a fake core, ?mock&test = its checks too */
  if (/^\?mock(&test)?$/.test(location.search)) document.write('<script src="mock.tray.js"><\/script>');</script>
<script src="tray.js"></script>
<script>if (location.search === '?mock&test') document.write('<script src="mock.tray.test.js"><\/script>');</script>
</body>
</html>
